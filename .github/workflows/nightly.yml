name: Nightly briefing
on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install -g @bitget-ai/bitget-agent-cli
      - run: pip install -r requirements.txt
      - name: Collect overnight data
        run: python backend/collect.py
      - name: Write briefing
        env:
          QWEN_API_KEY: ${{ secrets.QWEN_API_KEY }}
          QWEN_BASE_URL: "https://hackathon.bitgetops.com/v1"
          LLM_MODEL: "qwen3.8-max"
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          LLM_FALLBACK: "openai/gpt-oss-120b"
        run: python backend/brief.py
      - name: Save results
        run: |
          mkdir -p data/archive
          cp data/briefing.json "data/archive/$(date -u +%F).json"
          git config user.name "noctis-bot"
          git config user.email "noctis-bot@users.noreply.github.com"
          git add data
          git commit -m "Nightly briefing $(date -u +%F)" || echo "nothing to commit"
          git push
      - name: Build archive index
        run: |
          python3 -c "
          import json, os
          files = sorted(f[:-5] for f in os.listdir('data/archive') if f.endswith('.json') and f != 'index.json')
          json.dump({'dates': list(reversed(files))}, open('data/archive/index.json','w'))
          "
          git add data/archive/index.json
          git commit -m "Update archive index" || echo "nothing to commit"
          git push
