name: Nightly briefing
on:
  schedule:
    - cron: "0 5 * * *"   # 05:00 UTC daily; we will set this to your wake-up time
  workflow_dispatch:
permissions:
  contents: write
jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install -g @bitget-ai/bitget-agent-cli
      - run: pip install -r requirements.txt
      - name: Collect overnight data
        run: python backend/collect.py
      - name: Write briefing
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python backend/brief.py
      - name: Save results
        run: |
          mkdir -p data/archive
          cp data/briefing.json "data/archive/$(date -u +%F).json"
          git config user.name "noctis-bot"
          git config user.email "noctis-bot@users.noreply.github.com"
          git add data
          git commit -m "Nightly briefing $(date -u +%F)" || echo "nothing to commit"
          git push
